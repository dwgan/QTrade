app:
  name: qtrade
  timezone: Asia/Shanghai

paths:
  raw: data/raw
  curated: data/curated
  snapshots: data/snapshots
  reports: reports
  runtime: runtime

provider:
  name: tushare
  token_env: TUSHARE_TOKEN
  request_pause_seconds: 0.2
  retry_attempts: 3

market:
  exchange: SSE
  index_codes:
    - 000300.SH
    - 000905.SH
    - 000852.SH
  primary_index_code: 000300.SH
  history_calendar_days: 500
  minimum_history_days: 120
  minimum_breadth_stocks: 100
  attack_threshold: 70
  balanced_threshold: 50
  defensive_threshold: 30

industry:
  classification_column: industry
  minimum_stocks: 5
  top_count: 10
  history_calendar_days: 180
  style_pairs:
    mid_vs_large:
      - 000905.SH
      - 000300.SH
    small_vs_large:
      - 000852.SH
      - 000300.SH

update:
  datasets:
    - trade_calendar
    - security_master
    - security_names
    - daily_prices
    - adjust_factors
    - index_daily
    - index_members

validation:
  minimum_daily_rows: 100
  fail_on_warning: false
