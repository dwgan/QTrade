app:
  name: qtrade
  timezone: Asia/Shanghai

paths:
  raw: data/raw
  curated: data/curated
  snapshots: data/snapshots
  reports: reports
  runtime: runtime

provider:
  name: tushare
  token_env: TUSHARE_TOKEN
  request_pause_seconds: 0.2
  retry_attempts: 3

market:
  exchange: SSE
  index_codes:
    - 000300.SH
    - 000905.SH
    - 000852.SH
  primary_index_code: 000300.SH
  history_calendar_days: 500
  minimum_history_days: 120
  minimum_breadth_stocks: 100
  attack_threshold: 70
  balanced_threshold: 50
  defensive_threshold: 30

industry:
  classification_column: industry
  minimum_stocks: 5
  top_count: 10
  history_calendar_days: 180
  style_pairs:
    mid_vs_large:
      - 000905.SH
      - 000300.SH
    small_vs_large:
      - 000852.SH
      - 000300.SH

factors:
  history_calendar_days: 500
  minimum_history_days: 121
  minimum_listing_days: 365
  liquidity_exclusion_percentile: 0.20
  candidate_count: 30
  max_candidates_per_industry: 5
  exclude_industry_keywords:
    - 银行
    - 保险
    - 证券
    - 多元金融
  weights:
    quality: 0.35
    momentum: 0.30
    value: 0.20
    low_risk: 0.15

research:
  forward_horizon_days: 20
  quantiles: 5
  minimum_cross_section: 10

backtest:
  initial_capital: 1000000
  transaction_cost_rate: 0.0015
  slippage_rate: 0.0005
  annual_risk_free_rate: 0.0
  candidate_count: 20
  max_candidates_per_industry: 5
  benchmark_code: 000300.SH
  sample_split_ratio: 0.70
  cost_sensitivity_multipliers:
    - 0.0
    - 1.0
    - 2.0

observation:
  watchlist_symbols: []
  candidate_count: 20
  rank_mover_count: 10
  shadow_lookback_calendar_days: 365

update:
  datasets:
    - trade_calendar
    - security_master
    - security_names
    - daily_prices
    - adjust_factors
    - index_daily
    - index_members
    - daily_basic
    - stock_limit

validation:
  minimum_daily_rows: 100
  fail_on_warning: false
